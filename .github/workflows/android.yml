name: Android/Termux

# Android support is validated on a real Termux device through a self-hosted
# runner. The runner only needs ssh/rsync; scripts/ci/android-device.sh syncs
# the checkout and runs commands inside Termux. Hosted runners cannot provide
# process.platform=android, bionic NAPI, or a real /data/data filesystem.

on:
  workflow_dispatch:
  schedule:
    - cron: '43 18 * * *'
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'apps/cli/**'
      - 'docs/user/guide/android-termux.*'
      - 'native/**'
      - 'packages/**'
      - 'scripts/check-android.mjs'
      - 'scripts/ci/**'
      - 'scripts/setup-android*'
      - 'scripts/verify-android-addons.mjs'
      - 'snapshots/**'
      - 'vendor/android-prebuilds/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

# Every ref syncs the same checkout into DSH_ANDROID_ROOT on one physical
# device, so runs must never overlap: a per-ref group would let two rsyncs
# write the same tree. Serialize on a fixed group and keep cancelling a
# superseded run so the device starts the newest revision promptly.
concurrency:
  group: android-device
  cancel-in-progress: true

jobs:
  termux:
    name: Termux device
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, android-device]
    timeout-minutes: 90
    env:
      DSH_ANDROID_DEVICE: ${{ secrets.DSH_ANDROID_DEVICE }}
      DSH_SNAPSHOT_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Sync checkout to the device
        run: scripts/ci/android-device.sh sync
      - name: Install dependencies
        run: scripts/ci/android-device.sh run 'pnpm install --frozen-lockfile'
      - name: Install Android native addons
        run: scripts/ci/android-device.sh run 'pnpm run setup:android'
      - name: Build artifacts and type-check aggregates
        run: scripts/ci/android-device.sh run 'pnpm run build:artifacts && pnpm run build:check'
      - name: Android acceptance checks
        run: scripts/ci/android-device.sh run 'pnpm run check:android'
      - name: Keyless session replay
        run: scripts/ci/android-device.sh run 'pnpm run test:snapshot'
